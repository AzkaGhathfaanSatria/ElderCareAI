# Konfigurasi SonarQube/SonarCloud untuk analisis kode statis ElderCare AI.
# Jalankan lewat SonarScanner CLI atau GitHub Actions (lihat .github/workflows/ci.yml).

sonar.projectKey=eldercareai
sonar.projectName=ElderCare AI
sonar.organization=CHANGE_ME_ORG

# Root sumber kode yang dipindai
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**

# Coverage (isi setelah test unit/integrasi tersedia, mis. Vitest + istanbul)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# TypeScript project
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
